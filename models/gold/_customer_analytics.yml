version: 2

models:
  - name: mart_customer_retention
    description: "Monthly customer cohort retention based on repeat purchasing activity."
    columns:
      - name: cohort_month
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null
      - name: months_since_first_purchase
        data_tests:
          - not_null
      - name: cohort_size
        data_tests:
          - not_null
      - name: active_customers
        data_tests:
          - not_null
      - name: retention_rate
        data_tests:
          - not_null

  - name: mart_customer_purchase_behavior
    description: "Customer-level order counts and one-time versus repeat purchase classification."
    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique
      - name: total_orders
        data_tests:
          - not_null
      - name: customer_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "One-time Customer"
                  - "Repeat Customer"
